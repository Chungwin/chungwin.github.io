<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · Chung Huynh{% else %}Chung Huynh{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}Chung Huynh writes from Hamburg about technology, markets, and the occasional philosophical detour.{% endif %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body class="{% if page.background == 'white' %}bg-white{% endif %}">

  <header class="site-head">
    <div class="wrap head-inner">
      <a class="mark" href="{{ '/' | relative_url }}">Chung&nbsp;Huynh</a>
      <nav class="nav" aria-label="Primary">
        <a href="{{ '/#writing' | relative_url }}">writing</a>
        <a href="{{ '/poker/' | relative_url }}">poker</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-foot">
    <div class="wrap">
      <div class="links">
        <a href="https://www.linkedin.com/in/chunghuynh/" data-goatcounter-click="out/linkedin" data-goatcounter-title="LinkedIn (footer)">LinkedIn</a><span class="sep">/</span>
        <a href="https://github.com/chungwin" data-goatcounter-click="out/github" data-goatcounter-title="GitHub (footer)">GitHub</a>
      </div>
      <p class="colophon">
        Chung Huynh writes from Hamburg — about technology, markets, and the occasional philosophical detour.
      </p>
      <p class="colophon" style="margin-top:.35rem;">
        Visits are counted with <a href="https://www.goatcounter.com" rel="noopener" style="color:inherit;">GoatCounter</a>: no cookies, nothing that identifies you.
      </p>
    </div>
  </footer>

  <!-- GoatCounter: anonymous, cookie-free page-view counts (same site code as the poker app) -->
  <script data-goatcounter="https://chungwin.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
