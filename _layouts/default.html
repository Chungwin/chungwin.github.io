<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{% if page.title %}{{ page.title }} · Chung Huynh{% else %}Chung Huynh{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}Independent research and analysis by Chung Huynh: a research desk on small mining companies, essays on markets and technology, and a few tools built on the side.{% endif %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#0B0F12">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" href="/assets/favicons/sprout.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicons/sprout-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/favicons/sprout-touch.png">
</head>
<body class="{% if page.background == 'white' %}bg-white{% endif %}">
<div class="wrap">

  <header class="mast">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="wm">Chung Huynh</span></a>
    <nav class="nav" aria-label="Primary">
      <a href="{{ '/equities/' | relative_url }}"{% if page.nav == 'research' %} class="on"{% endif %}>Research</a>
      <a href="{{ '/#writing' | relative_url }}"{% if page.layout == 'post' %} class="on"{% endif %}>Writing</a>
      <a href="{{ '/#tools' | relative_url }}">Tools</a>
      <a href="{{ '/#about' | relative_url }}">About</a>
    </nav>
  </header>

  {{ content }}

  <footer class="foot">
    <div class="links">
      <a href="https://www.linkedin.com/in/chunghuynh/" data-goatcounter-click="out/linkedin" data-goatcounter-title="LinkedIn (footer)">LinkedIn</a>
      <a href="https://github.com/chungwin" data-goatcounter-click="out/github" data-goatcounter-title="GitHub (footer)">GitHub</a>
      <span>Visits counted with <a href="https://www.goatcounter.com" rel="noopener">GoatCounter</a> · no cookies, nothing that identifies you</span>
    </div>
    <p class="disc">Independent research and analysis by one person, written with AI assistance. Not investment advice; small mining companies can lose most of their value.</p>
  </footer>

</div>
<!-- GoatCounter: anonymous, cookie-free page-view counts (same site code as the poker app) -->
<script data-goatcounter="https://chungwin.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
