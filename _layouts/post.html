---
layout: default
---

<article class="post">
  <header class="post-head">
    <a class="backlink" href="{{ '/#writing' | relative_url }}">← Writing</a>
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
  </header>

  <div class="prose">
    {{ content }}
  </div>

  <footer class="post-foot">
    <a class="backlink" href="{{ '/#writing' | relative_url }}">← All writing</a>
  </footer>
</article>
