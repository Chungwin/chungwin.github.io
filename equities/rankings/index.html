/* Layout: one fixed tab strip at the top; the active tracker fills the rest of the viewport in its own frame.
   Single dark look by choice — both embedded trackers are dark-only, and the strip has to sit flush against them. */
:root {
  --bg:#111517; --panel:#181D20; --ink:#E8EBEC; --mute:#8D999E; --line:#262E32;
  --pm:#D9A94A;   /* gold — precious metals tracker accent */
  --cm:#A99BF0;
  --cu:#4FB3A3;   /* teal — copper tracker accent */
  --hs:#C2C9CC;   /* history — neutral, spans all groups */
  --font:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.4; display:flex; flex-direction:column; overflow:hidden; }
header.strip { flex:none; background:var(--panel); border-bottom:1px solid var(--line); padding:0 16px; display:flex; align-items:stretch; justify-content:space-between; gap:12px; }
.tabs { display:flex; gap:4px; min-width:0; }
.tab { font:inherit; font-size:15px; font-weight:500; color:var(--mute); background:none; border:none; border-bottom:3px solid transparent; padding:14px 14px 11px; cursor:pointer; display:flex; align-items:baseline; gap:10px; white-space:nowrap; letter-spacing:-0.005em; }
.tab .meta { font-size:12px; font-weight:400; color:var(--mute); font-variant-numeric:tabular-nums; }
.tab:hover { color:var(--ink); }
.tab[aria-selected="true"] { color:var(--ink); font-weight:600; }
.tab[data-tab^="pm"][aria-selected="true"] { border-bottom-color:var(--pm); }
.tab[data-tab="cu"][aria-selected="true"] { border-bottom-color:var(--cu); }
.tab[data-tab="cm"][aria-selected="true"] { border-bottom-color:var(--cm); }
.tab[data-tab="hist"][aria-selected="true"] { border-bottom-color:var(--hs); }
.tab.hist { margin-left:6px; border-left:1px solid var(--line); padding-left:16px; }
.hico { width:13px; height:13px; align-self:center; flex:none; color:var(--mute); }
.tab[aria-selected="true"] .hico { color:var(--ink); }
.dot.pm { background:var(--pm); }
.dot.cu { background:var(--cu); }
.dot.cm { background:var(--cm); }
.side a { color:var(--mute); text-decoration:none; border-bottom:1px solid var(--line); }
.side a:hover { color:var(--ink); }
.tabs { overflow-x:auto; scrollbar-width:none; }
.tabs::-webkit-scrollbar { display:none; }
.dot { width:9px; height:9px; border-radius:50%; align-self:center; flex:none; }
.tab:focus-visible { outline:2px solid var(--ink); outline-offset:-4px; border-radius:4px; }
.side { display:flex; align-items:center; gap:14px; font-size:12.5px; color:var(--mute); white-space:nowrap; }
main { flex:1; min-height:0; position:relative; }
iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg); }
iframe[hidden] { display:none; }
@media (max-width:1499px) { .tab .meta { display:none; } }
@media (max-width:1150px) { .tab .grp { display:none; } }
.tabwrap { position:relative; display:flex; min-width:0; }
.more { display:none; position:absolute; right:0; top:0; bottom:0; width:44px; border:0; padding:0 4px 0 18px; cursor:pointer; color:var(--ink); font:inherit; font-size:20px; line-height:1;
  background:linear-gradient(to right, rgba(24,29,32,0), var(--panel) 45%); text-align:right; }
.tabwrap.more-r .more { display:block; }
@media (max-width:520px) {
  .tab .grp { display:none; }
  header.strip { padding:0 8px; }
  .tab { padding:12px 10px 9px; font-size:14px; gap:7px; }
  .tab .meta { display:none; }
  .side { display:none; }
}
@media (prefers-reduced-motion: no-preference) { .tab { transition:color .12s, border-color .12s; } }

.cw-home { flex:none; display:flex; align-items:center; padding:0 16px 0 0; margin-right:6px; border-right:1px solid var(--line,#262E32);
  font:400 18px/1 "Source Serif 4","Iowan Old Style",Georgia,serif; letter-spacing:-.005em; color:var(--ink,#E8EBEC); text-decoration:none; white-space:nowrap; }
.cw-home:hover { color:#CFA451; }
.cw-home-short { display:none; }
.cw-home + .tabs, .cw-home + .tabwrap { margin-right:auto; }   /* keep the tabs next to the home link; the side links stay right */
@media (max-width:1100px) { .cw-home { padding-right:10px; margin-right:2px; font-size:18px; } .cw-home-full { display:none; } .cw-home-short { display:inline; font-family:"IBM Plex Sans",sans-serif; } }
</style>

<script>
(function(){
  var KEYS = ['pmd','pmp','cu','cm','hist'];
  var SRC = { pmd:'pmd.html', pmp:'pmp.html', cu:'cu.html', cm:'cm.html', hist:'hist.html' };
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var frames = {}; KEYS.forEach(function(k){ frames[k] = document.getElementById('frame-' + k); });
  var current = null;

  // Hash forms: #pmd, #pmp, #cu, and #<tab>.<section> e.g. #cu.rank-b
  function parseHash(){
    var h = (location.hash || '').slice(1);
    if(!h) return null;
    var i = h.indexOf('.');
    var key = i === -1 ? h : h.slice(0, i);
    var slug = i === -1 ? '' : h.slice(i + 1);
    if(KEYS.indexOf(key) === -1) return null;
    return { key:key, slug:slug };
  }
  function remember(key){ try { localStorage.setItem('rankings-tab', key); } catch(e){} }
  function recall(){ try { return localStorage.getItem('rankings-tab'); } catch(e){ return null; } }

  function load(key, slug){
    var f = frames[key];
    var want = SRC[key] + (slug ? '#' + slug : '');
    if(!f.getAttribute('src')){ f.setAttribute('src', want); return; }
    if(slug){ try { f.contentWindow.location.hash = slug; } catch(e){ f.setAttribute('src', want); } }
  }

  function show(key, slug, fromHash){
    if(KEYS.indexOf(key) === -1) key = 'pmd';
    tabs.forEach(function(t){
      var on = t.getAttribute('data-tab') === key;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
    });
    KEYS.forEach(function(k){ frames[k].hidden = k !== key; });
    load(key, slug);
    current = key;
    remember(key);
    if(!fromHash){
      var h = '#' + key + (slug ? '.' + slug : '');
      if(location.hash !== h) history.replaceState(null, '', h);
    }
  }
  // called from inside the frames ("Producer rankings" / "Developer rankings" links)
  window.showRanking = function(key, slug){
    // from a ranking tab, "History" opens the history on that tab's group
    if(key === 'hist' && !slug && current && current !== 'hist') slug = current;
    show(key, slug); var t = document.getElementById('tab-' + key); if(t) t.focus();
  };

  tabs.forEach(function(t, i){
    t.addEventListener('click', function(){ show(t.getAttribute('data-tab')); });
    t.addEventListener('keydown', function(e){
      if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      var n = (i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
      var key = tabs[n].getAttribute('data-tab');
      show(key); tabs[n].focus();
    });
  });

  function syncHash(){
    if(!current) return;
    try {
      var inner = frames[current].contentWindow.location.hash.slice(1);
      var h = '#' + current + (inner ? '.' + inner : '');
      if(location.hash !== h) history.replaceState(null, '', h);
    } catch(e){}
  }
  KEYS.forEach(function(k){
    frames[k].addEventListener('load', function(){
      try { frames[k].contentWindow.addEventListener('hashchange', syncHash); } catch(e){}
    });
  });

  window.addEventListener('hashchange', function(){ var p = parseHash(); if(p) show(p.key, p.slug, true); });

  var strip = document.querySelector('.tabs'), wrap = document.querySelector('.tabwrap');
  function hint(){ wrap.classList.toggle('more-r', strip.scrollWidth - strip.clientWidth - strip.scrollLeft > 4); }
  strip.addEventListener('scroll', hint, {passive:true}); window.addEventListener('resize', hint);
  document.querySelector('.more').addEventListener('click', function(){ strip.scrollBy({left: strip.clientWidth * 0.7, behavior:'smooth'}); });
  tabs.forEach(function(t){ t.addEventListener('click', function(){ t.scrollIntoView({block:'nearest', inline:'nearest', behavior:'smooth'}); }); });

  var start = parseHash();
  if(start) show(start.key, start.slug, true);
  else { var r = recall(); show(KEYS.indexOf(r) !== -1 ? r : 'pmd'); }
  hint(); setTimeout(hint, 400);
  var act = document.getElementById('tab-' + current); if(act && act.offsetLeft + act.offsetWidth > strip.clientWidth) strip.scrollLeft = act.offsetLeft - 40;
})();
